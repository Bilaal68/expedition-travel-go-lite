<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Minimalist Architectural Geometric Mark -->
  <g transform="translate(4, 6)">
    <!-- Stylized Compass Mountain Summit with Electric Purple Accent Point -->
    <path d="M4 48 L26 10 L48 48 Z" fill="#1F3D28" />
    <path d="M26 10 L48 48 L26 44 Z" fill="#152B1C" />
    <path d="M14 48 L26 26 L38 48 Z" fill="#E8DCC4" />
    <polygon points="26,6 30,13 26,11 22,13" fill="#8B5CF6" />
    <!-- Fine horizon rule -->
    <line x1="0" y1="50" x2="52" y2="50" stroke="#1F3D28" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Editorial Brand Typography -->
  <g transform="translate(68, 12)">
    <!-- EXPEDITION TRAVEL -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="3.5" fill="#1F3D28">
      EXPEDITION
    </text>
    <text x="135" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="300" letter-spacing="3.5" fill="#1F3D28">
      TRAVEL
    </text>
    
    <!-- Sub-brand GO LITE + ETAA / ACCREDITED -->
    <g transform="translate(0, 36)">
      <rect x="0" y="-8" width="56" height="13" rx="2" fill="#8B5CF6" />
      <text x="6" y="2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
        GO LITE
      </text>
      <text x="66" y="2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.8" fill="#1F3D28" opacity="0.7">
        MEMBER ETAA • LICENSED
      </text>
    </g>
  </g>
</svg>